# KeyBridge project definition for XcodeGen.
#
# This file is the source of truth for the Xcode project. KeyBridge.xcodeproj is
# generated from it and committed so a fresh clone builds with no extra tools,
# but hand edits to the .xcodeproj are lost on the next regeneration. Change
# settings here, then run:
#
#   xcodegen generate

name: KeyBridge

options:
  bundleIdPrefix: io.github.lynnjeans
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  KeyBridge:
    type: application
    platform: macOS
    sources:
      - path: KeyBridge
        excludes:
          - Resources/Info.plist
          - Resources/Templates
      # Blank Office documents for the Finder menu, kept in a Templates folder
      # inside the app (scripts/make-office-templates.py).
      - path: KeyBridge/Resources/Templates
        type: folder
        buildPhase: resources
      # Shipped inside the app, as GPL-3.0 asks of every copy handed on, and
      # shown from the About page.
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      # The Finder right-click menu (KB-210), embedded in Contents/PlugIns.
      - target: KeyBridgeFinder
    info:
      path: KeyBridge/Resources/Info.plist
      properties:
        CFBundleDisplayName: KeyBridge
        # Read versions from build settings so MARKETING_VERSION and
        # CURRENT_PROJECT_VERSION are the single place to bump them. Left to
        # itself XcodeGen writes a hard-coded "1.0", and Sparkle compares these.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Menu bar utility: no Dock icon and no app menu. The main window is
        # opened on demand from the menu bar item.
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        # The languages KeyBridge ships in (M9). Listing them lets macOS pick
        # one per app in System Settings › General › Language & Region.
        CFBundleLocalizations: [en, zh-Hans, ja]
        NSHumanReadableCopyright: "Copyright © 2026 Lei Sun and KeyBridge contributors. Licensed under GPL-3.0."
        # The Finder extension hands each menu choice to the app as a
        # keybridge:// URL (FinderMenuRequest).
        CFBundleURLTypes:
          - CFBundleURLName: io.github.lynnjeans.KeyBridge.finder
            CFBundleURLSchemes: [keybridge]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lynnjeans.KeyBridge
        PRODUCT_NAME: KeyBridge
        # Resources/AppIcon.icon, made in Icon Composer: Liquid Glass on macOS
        # 26, and actool derives the flat icon macOS 14 and 15 show (KB-106).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Global input interception cannot run inside the App Sandbox, so the
        # sandbox stays off permanently. Hardened runtime is required for
        # notarization; Xcode only applies it when signing with a real
        # identity, so ad-hoc development builds run without it.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        # Strings are extracted into Resources/Localizable.xcstrings on every
        # build; Xcode lists any a translation is missing.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Signing is configured in xcconfig files, not here: target settings in
    # this file would override them. See Config/Signing.xcconfig.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    # Shared scheme, committed so command-line builds and CI can find it.
    scheme:
      testTargets:
        - KeyBridgeTests

  # The Finder right-click menu (KB-210). Finder only loads a sandboxed
  # extension, so it builds the menu and leaves the work to the app.
  KeyBridgeFinder:
    type: app-extension
    platform: macOS
    sources:
      - path: KeyBridgeFinder
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: KeyBridge/FinderMenu/NewDocument.swift
    info:
      path: KeyBridgeFinder/Info.plist
      properties:
        CFBundleDisplayName: KeyBridge Finder Menu
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "Copyright © 2026 Lei Sun and KeyBridge contributors. Licensed under GPL-3.0."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).FinderSync"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lynnjeans.KeyBridge.Finder
        PRODUCT_NAME: KeyBridgeFinder
        CODE_SIGN_ENTITLEMENTS: KeyBridgeFinder/KeyBridgeFinder.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: NO
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig

  # Unit tests for logic that does not need a running app. The bundle compiles
  # the sources it tests itself instead of loading them from a host app, so a
  # test run never launches KeyBridge or starts its event tap.
  KeyBridgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KeyBridgeTests
      - path: KeyBridge/Rules
      - path: KeyBridge/Engine/RuleMatcher.swift
      - path: KeyBridge/Engine/EventTrigger.swift
      - path: KeyBridge/Engine/Dispatcher.swift
      - path: KeyBridge/Engine/SyntheticEvent.swift
      - path: KeyBridge/Engine/ScrollStepper.swift
      - path: KeyBridge/Engine/WheelDirection.swift
      - path: KeyBridge/Engine/DockClick.swift
      - path: KeyBridge/Window/WindowGeometry.swift
      - path: KeyBridge/Window/WindowAction.swift
      - path: KeyBridge/Window/WindowElement.swift
      - path: KeyBridge/Permissions
      - path: KeyBridge/Clipboard
      - path: KeyBridge/PathBox/PathBoxResolver.swift
      - path: KeyBridge/App/EngineController.swift
      - path: KeyBridge/App/DiagnosticReport.swift
      - path: KeyBridge/FinderMenu/NewDocument.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lynnjeans.KeyBridgeTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
