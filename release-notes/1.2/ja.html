<ul>
  <li><b>入力ソースを切り替え</b>：新しいシステム機能で、Caps Lock のように ABC といつも使う入力ソース（日本語、中国語、韓国語、ロシア語など）を直接切り替えます。切り替えの表示は出ません。「カスタムルール」で Shift の単独押しなど、好きなキーに割り当てられます。</li>
  <li><b>Win+スペース</b>：「Windows キー」グループをオンにすると、Windows と同じように Win+スペースで入力ソースを切り替えます。</li>
  <li><b>パスを貼り付け</b>：⌘L のパスボックスはなくなりました。Finder と開く・保存ダイアログで Ctrl+Shift+G を押してパスを貼り付けます。</li>
</ul>
