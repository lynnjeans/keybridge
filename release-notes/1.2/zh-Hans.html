<ul>
  <li><b>Win+V 打开剪贴板历史</b>：开启“Windows 键”快捷键后，每块键盘都按它自己的 Win 键 + V 打开剪贴板历史。鼠标按键和自定义规则也可以设成打开它。</li>
  <li><b>记录快捷键</b>：快捷键没有按预期工作时，在“关于”页开始记录，再按一次那个快捷键，然后导出诊断信息，就能看到它来自哪块键盘、被转成了什么。只记快捷键，不记打字内容。</li>
  <li><b>更简洁的菜单栏菜单</b>：总开关改叫“启用 KeyBridge”，只在暂停或出问题时显示状态；暂停可选 5 分钟、15 分钟或 1 小时，要一直停用就关掉开关。</li>
</ul>
