<ul>
  <li><b>パスを貼り付け</b>：「最近の場所」（Ctrl+Shift+G）にパスを貼り付けると、フォルダならそこへ移動し、ファイルならそのまま開きます。</li>
  <li><b>設定のバックアップ</b>：「情報」ページで設定をファイルに書き出し、別の Mac で読み込めます。読み込む前に現在の設定を自動でバックアップします。</li>
  <li><b>メニューバーアイコンを隠す</b>：「概要」で「メニューバーに表示」をオフにしても SameKeys はそのまま動作します。「アプリケーション」や Spotlight からもう一度開くとウインドウが戻ります。</li>
  <li><b>新しいアイコン</b>：App とメニューバーが新しい ∞ アイコンになりました。</li>
</ul>
